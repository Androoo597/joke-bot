version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dick-bot
    restart: unless-stopped
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - DB_DIR=/app/data
    env_file:
      - .env
    ports:
      - "6456:6456"
    volumes:
      # Монтируем директорию для сохранения базы данных SQLite
      - ./data:/app/data
